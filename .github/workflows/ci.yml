name: CI

on:
  workflow_dispatch:
  # release.yml runs it on the commit it releases.
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Each job's limit is about four times its time in the runs of
# November 2026, rather than GitHub's six hours.
jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # check.sh keeps go test's events; the step after lists from them
      # the tests this system skipped, with their reasons: a test that
      # skips where it should run passes having tested nothing.
      - name: Check
        run: RAMUS_TEST_JSON="$RUNNER_TEMP/tests" scripts/check.sh
      - name: Tests skipped
        if: ${{ !cancelled() }}
        run: |
          set -- "$RUNNER_TEMP"/tests/*.json
          if [ ! -e "$1" ]; then echo "check.sh ran no tests"; exit 0; fi
          go run ./scripts/testlog -skips "$@"
      - name: What starting git costs
        run: RAMUS_MEASURE=1 go test ./spike/spawn -run Spawn -v
      - name: Build without cgo
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ramus" .
      - name: The binary links only the system
        run: |
          libs=$(otool -L "$RUNNER_TEMP/ramus" | tail -n +2 | awk '{print $1}')
          echo "$libs"
          if echo "$libs" | grep -v -e '^/usr/lib/' -e '^/System/Library/'; then
            echo "links a library outside the system" >&2
            exit 1
          fi
      # Go decides the oldest macOS the binary starts on, and a new Go can
      # raise it. The Info.plist mygo writes from mygo.json must say the
      # same, or macOS installs the app where it then cannot start.
      - name: The binary's minimum macOS is the app's
        run: |
          binary=$(otool -l "$RUNNER_TEMP/ramus" | awk '$1 == "cmd" { build = $2 == "LC_BUILD_VERSION" } build && $1 == "minos" { print $2; exit }')
          app=$(jq -r .macos.minimumSystemVersion mygo.json)
          echo "the binary needs macOS $binary; mygo.json says $app"
          if [ "$binary" != "$app" ]; then
            echo "set macos.minimumSystemVersion in mygo.json, and the README, to $binary" >&2
            exit 1
          fi
      # The hosted runner is a VM with a virtual GPU, nearly all of whose
      # time is AppKit and Metal. Over the 20 runs of 15 to 18 November
      # 2026 the median of ten starts went from 141 to 374 ms and the
      # fastest from 135 to 263 ms, for the same code: the runner cannot
      # hold the 200 ms that hardware does (171 ms on Apple silicon, see
      # docs/benchmarks.md). It fails past 300 ms, above every fastest
      # run seen, and warns past 250 ms, which two of the twenty reached.
      - name: Cold start to first frame
        run: go run ./scripts/coldstart -runs 10 -budget 300ms -warn 250ms "$RUNNER_TEMP/ramus"

  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Git version
        run: git --version
      - name: Check
        run: RAMUS_TEST_JSON="$RUNNER_TEMP/tests" scripts/check.sh
      - name: Tests skipped
        if: ${{ !cancelled() }}
        run: |
          set -- "$RUNNER_TEMP"/tests/*.json
          if [ ! -e "$1" ]; then echo "check.sh ran no tests"; exit 0; fi
          go run ./scripts/testlog -skips "$@"
      - name: What starting git costs
        run: RAMUS_MEASURE=1 go test ./spike/spawn -run Spawn -v
      # The runner has git-lfs; the test skips where it is missing, so
      # here only a pass passes: not a skip, nor no test at all if it is
      # renamed. An explicit bash fails the pipe when go test fails.
      - name: Clone with Git LFS
        shell: bash
        run: |
          git lfs version
          go test ./internal/git/write -run '^TestCloneLFS$' -count=1 -v | tee "$RUNNER_TEMP/lfs.txt"
          grep -q -- '^--- PASS: TestCloneLFS ' "$RUNNER_TEMP/lfs.txt"
      - name: Build without cgo
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ramus" .

  linux-packages:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Tarball, deb, rpm and PKGBUILD
        run: go tool mygo build -platform linux/amd64 -o "$RUNNER_TEMP/dist"
      - name: AppImage
        run: scripts/appimage.sh "$RUNNER_TEMP/dist/linux-amd64" "$RUNNER_TEMP/dist"
      - name: The packages hold the app
        run: |
          cd "$RUNNER_TEMP/dist"
          ls -l linux-amd64 *.AppImage
          dpkg-deb --info linux-amd64/ramus_*_amd64.deb
          dpkg-deb --contents linux-amd64/ramus_*_amd64.deb | grep -q './opt/ramus/ramus$'
          tar tzf linux-amd64/ramus-*-linux-amd64.tar.gz | grep -qx 'ramus'
          rpm -qip linux-amd64/ramus-*.x86_64.rpm
          rpm -qlp linux-amd64/ramus-*.x86_64.rpm | grep -q '/opt/ramus/ramus$'
          chmod +x ramus-*-linux-x86_64.AppImage
          ./ramus-*-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/lib/ramus/ramus
      - name: The deb installs, and the app starts as far as its command line
        run: |
          sudo apt-get install -y "$RUNNER_TEMP/dist/linux-amd64/"ramus_*_amd64.deb
          set +e
          ramus --no-such-flag 2>err.txt
          code=$?
          set -e
          cat err.txt
          test "$code" = 2 && grep -q '^usage:' err.txt

  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # The tree is LF; converting it on checkout would fail gofmt.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Git version
        run: git --version
      - name: Check
        run: RAMUS_TEST_JSON="$RUNNER_TEMP/tests" scripts/check.sh
      - name: Tests skipped
        if: ${{ !cancelled() }}
        run: |
          set -- "$RUNNER_TEMP"/tests/*.json
          if [ ! -e "$1" ]; then echo "check.sh ran no tests"; exit 0; fi
          go run ./scripts/testlog -skips "$@"
      - name: What starting git costs
        run: RAMUS_MEASURE=1 go test ./spike/spawn -run Spawn -v
      - name: Build without cgo
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ramus.exe" .
