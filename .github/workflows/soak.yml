name: Soak

# Opens, changes, refreshes and closes repositories for hours, then checks
# that goroutines, open files, git processes and memory came back.
on:
  workflow_dispatch:
    inputs:
      length:
        description: How long to soak (a Go duration)
        default: 2h

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Soak
        env:
          RAMUS_SOAK: ${{ inputs.length || '2h' }}
        run: go run ./bench -runs 1 -only '^soak$'
